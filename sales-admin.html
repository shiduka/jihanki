<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>売上データ管理</title>
    <style>
        :root {
            --primary: #4CAF50;
            --primary-dark: #2E7D32;
            --danger: #E53935;
            --warning: #FF9800;
            --bg: #f5f5f5;
            --card-bg: #fff;
            --border: #ddd;
            --text: #333;
            --text-light: #888;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 0;
            min-height: 100vh;
        }

        /* ヘッダー */
        .header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 16px 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .header h1 {
            font-size: 1.3rem;
            margin-bottom: 4px;
        }

        .header-sub {
            font-size: 0.85rem;
            opacity: 0.9;
        }

        .back-link {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            text-decoration: none;
            font-size: 1.5rem;
        }

        /* コントロールバー */
        .controls {
            padding: 12px 16px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .controls label {
            font-size: 0.9rem;
            font-weight: bold;
            white-space: nowrap;
        }

        .controls select,
        .controls input[type="date"] {
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.9rem;
            font-family: inherit;
        }

        .summary-bar {
            padding: 10px 16px;
            background: linear-gradient(135deg, #E8F5E9, #C8E6C9);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 0.95rem;
        }

        .summary-bar .count {
            color: var(--text-light);
        }

        .summary-bar .total {
            color: var(--primary-dark);
            font-size: 1.1rem;
        }

        /* 売上カード（モバイルフレンドリー） */
        .sales-list {
            padding: 8px 12px;
        }

        .sale-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 8px;
            overflow: hidden;
            transition: box-shadow 0.2s;
        }

        .sale-card.editing {
            border-color: var(--primary);
            box-shadow: 0 2px 12px rgba(76, 175, 80, 0.2);
        }

        .sale-card.deleted {
            opacity: 0.4;
            text-decoration: line-through;
        }

        /* 表示モード */
        .sale-display {
            display: flex;
            align-items: center;
            padding: 12px 14px;
            gap: 10px;
        }

        .sale-date {
            font-size: 0.8rem;
            color: var(--text-light);
            min-width: 70px;
            line-height: 1.3;
        }

        .sale-info {
            flex: 1;
        }

        .sale-product {
            font-weight: bold;
            font-size: 0.95rem;
            margin-bottom: 2px;
        }

        .sale-meta {
            font-size: 0.75rem;
            color: var(--text-light);
        }

        .sale-price {
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--primary-dark);
            white-space: nowrap;
        }

        .sale-bonus {
            font-size: 1rem;
        }

        .sale-actions {
            display: flex;
            gap: 4px;
            margin-left: 8px;
        }

        /* 編集モード */
        .sale-edit-form {
            padding: 12px 14px;
            display: none;
            flex-direction: column;
            gap: 8px;
        }

        .sale-card.editing .sale-display {
            display: none;
        }

        .sale-card.editing .sale-edit-form {
            display: flex;
        }

        .edit-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .edit-row label {
            font-size: 0.8rem;
            color: var(--text-light);
            min-width: 50px;
            white-space: nowrap;
        }

        .edit-row input,
        .edit-row select {
            flex: 1;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
            font-family: inherit;
        }

        .edit-row input:focus,
        .edit-row select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .edit-buttons {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 4px;
        }

        /* ボタン共通 */
        .btn {
            border: none;
            border-radius: 6px;
            padding: 8px 16px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            transition: opacity 0.2s;
        }

        .btn:active {
            opacity: 0.7;
        }

        .btn-icon {
            padding: 6px 10px;
            font-size: 1rem;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-cancel {
            background: #eee;
            color: var(--text);
        }

        .btn-add {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            background: var(--card-bg);
            border: 2px dashed var(--border);
            border-radius: 10px;
            color: var(--text-light);
            cursor: pointer;
            margin-bottom: 12px;
        }

        .btn-add:active {
            background: #f0f0f0;
        }

        /* フッター */
        .footer-actions {
            padding: 12px 16px;
            background: var(--card-bg);
            border-top: 1px solid var(--border);
            position: sticky;
            bottom: 0;
            display: flex;
            gap: 8px;
        }

        .footer-actions .btn {
            flex: 1;
            padding: 14px;
            font-size: 1rem;
        }

        /* 変更マーカー */
        .sale-card.modified {
            border-left: 4px solid var(--warning);
        }

        .sale-card.new-record {
            border-left: 4px solid var(--primary);
        }

        /* 空状態 */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-light);
        }

        .empty-state .emoji {
            font-size: 3rem;
            margin-bottom: 12px;
        }

        /* 保存通知 */
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 0.9rem;
            z-index: 200;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
        }

        /* チェックボックス風トグル */
        .bonus-toggle-small {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="index.html" class="back-link">←</a>
        <h1>📊 売上データ管理</h1>
        <div class="header-sub">売上記録の確認・編集</div>
    </header>

    <div class="controls">
        <label>期間:</label>
        <select id="period-select">
            <option value="7">直近7日間</option>
            <option value="14">直近14日間</option>
            <option value="30">直近30日間</option>
            <option value="all">すべて</option>
        </select>
        <label>自販機:</label>
        <select id="machine-select">
            <option value="all">すべて</option>
        </select>
    </div>

    <div class="summary-bar">
        <span class="count" id="record-count">0件</span>
        <span class="total" id="total-amount">合計: ¥0</span>
    </div>

    <div class="sales-list" id="sales-list">
        <!-- 売上カードがここに動的生成される -->
    </div>

    <div class="footer-actions" id="footer-actions" style="display:none;">
        <button class="btn btn-cancel" onclick="cancelAllChanges()">変更を取消</button>
        <button class="btn btn-primary" onclick="saveAllChanges()">💾 保存する</button>
    </div>

    <div class="toast" id="toast"></div>

    <script>
    // --- 定数 ---
    const STORAGE_KEY = 'vending_machine_data';

    // --- 状態管理 ---
    let appData = null;          // localStorageから読み込んだ全データ
    let originalSales = [];      // 変更前のバックアップ
    let hasChanges = false;

    // --- 初期化 ---
    document.addEventListener('DOMContentLoaded', () => {
        loadData();
        setupMachineFilter();
        renderSales();

        document.getElementById('period-select').onchange = renderSales;
        document.getElementById('machine-select').onchange = renderSales;
    });

    // --- データ読み込み ---
    function loadData() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
                appData = JSON.parse(raw);
            }
        } catch (e) {
            console.error('データ読み込みエラー', e);
        }

        if (!appData || !appData.sales) {
            appData = { sales: [], lockers: [], presets: [], machineCount: 2 };
        }

        // 元データのバックアップ（キャンセル用）
        originalSales = JSON.parse(JSON.stringify(appData.sales));
    }

    // --- 自販機フィルター設定 ---
    function setupMachineFilter() {
        const select = document.getElementById('machine-select');
        const machineCount = appData.machineCount || 2;
        for (let i = 1; i <= machineCount; i++) {
            const opt = document.createElement('option');
            opt.value = i;
            opt.textContent = `自販機${i}`;
            select.appendChild(opt);
        }
    }

    // --- フィルタリング ---
    function getFilteredSales() {
        const periodDays = document.getElementById('period-select').value;
        const machine = document.getElementById('machine-select').value;

        let filtered = [...appData.sales];

        // 期間フィルター
        if (periodDays !== 'all') {
            const days = parseInt(periodDays);
            const cutoff = new Date();
            cutoff.setDate(cutoff.getDate() - days);
            cutoff.setHours(0, 0, 0, 0);
            filtered = filtered.filter(s => new Date(s.date) >= cutoff);
        }

        // 自販機フィルター
        if (machine !== 'all') {
            const machineId = parseInt(machine);
            filtered = filtered.filter(s => s.machineId === machineId);
        }

        // 新しい順
        filtered.sort((a, b) => new Date(b.date) - new Date(a.date));

        return filtered;
    }

    // --- 売上一覧を描画 ---
    function renderSales() {
        const list = document.getElementById('sales-list');
        const filtered = getFilteredSales();

        list.innerHTML = '';

        // 新規追加ボタン
        const addBtn = document.createElement('button');
        addBtn.className = 'btn-add';
        addBtn.textContent = '＋ 売上を手動追加';
        addBtn.onclick = addNewSale;
        list.appendChild(addBtn);

        if (filtered.length === 0) {
            list.innerHTML += `
                <div class="empty-state">
                    <div class="emoji">📭</div>
                    <p>該当する売上データがありません</p>
                </div>
            `;
            updateSummary(filtered);
            return;
        }

        // 日付ごとにグループ化
        let currentDateLabel = '';
        filtered.forEach(sale => {
            const d = new Date(sale.date);
            const dateLabel = `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`;

            if (dateLabel !== currentDateLabel) {
                currentDateLabel = dateLabel;
                const dayNames = ['日', '月', '火', '水', '木', '金', '土'];
                const dayLabel = document.createElement('div');
                dayLabel.style.cssText = 'padding: 8px 4px 4px; font-weight: bold; color: #666; font-size: 0.85rem;';
                dayLabel.textContent = `${dateLabel}（${dayNames[d.getDay()]}）`;
                list.appendChild(dayLabel);
            }

            list.appendChild(createSaleCard(sale));
        });

        updateSummary(filtered);
    }

    // --- 売上カード生成 ---
    function createSaleCard(sale) {
        const card = document.createElement('div');
        card.className = 'sale-card';
        card.dataset.id = sale.id;

        const d = new Date(sale.date);
        const timeStr = `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
        const productDisplay = (sale.productName || '').replace(/\n/g, ', ');
        const bonusIcon = (sale.hasBonus === true || sale.hasBonus === 'true') ? '🎁 ' : '';
        const locInfo = sale.coordNum ? `[自販機${sale.machineNum || sale.machineId} ${sale.coordNum}]` : `[自販機${sale.machineId}]`;

        // 編集用の日時をフォーマット
        const editDate = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        const editTime = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;

        card.innerHTML = `
            <div class="sale-display">
                <div class="sale-date">${timeStr}</div>
                <div class="sale-info">
                    <div class="sale-product">${bonusIcon}${escapeHtml(productDisplay)}</div>
                    <div class="sale-meta">${locInfo}</div>
                </div>
                <div class="sale-price">¥${Number(sale.price).toLocaleString()}</div>
                <div class="sale-actions">
                    <button class="btn-icon" onclick="startEdit('${sale.id}')" title="編集">✏️</button>
                    <button class="btn-icon" onclick="deleteSale('${sale.id}')" title="削除">🗑️</button>
                </div>
            </div>
            <div class="sale-edit-form">
                <div class="edit-row">
                    <label>日付</label>
                    <input type="date" class="edit-date" value="${editDate}">
                    <input type="time" class="edit-time" value="${editTime}" style="max-width:110px;">
                </div>
                <div class="edit-row">
                    <label>商品名</label>
                    <input type="text" class="edit-product" value="${escapeHtml(productDisplay)}" placeholder="商品名">
                </div>
                <div class="edit-row">
                    <label>金額</label>
                    <input type="number" class="edit-price" value="${sale.price}" min="0" step="10">
                </div>
                <div class="edit-row">
                    <label>おまけ</label>
                    <input type="checkbox" class="bonus-toggle-small edit-bonus" ${(sale.hasBonus === true || sale.hasBonus === 'true') ? 'checked' : ''}>
                </div>
                <div class="edit-buttons">
                    <button class="btn btn-cancel" onclick="cancelEdit('${sale.id}')">キャンセル</button>
                    <button class="btn btn-primary" onclick="applyEdit('${sale.id}')">適用</button>
                </div>
            </div>
        `;

        return card;
    }

    // --- サマリー更新 ---
    function updateSummary(filtered) {
        const count = document.getElementById('record-count');
        const total = document.getElementById('total-amount');
        const sum = filtered.reduce((acc, s) => acc + (Number(s.price) || 0), 0);
        count.textContent = `${filtered.length}件`;
        total.textContent = `合計: ¥${sum.toLocaleString()}`;
    }

    // --- 編集操作 ---
    function startEdit(id) {
        // 他の編集中カードを閉じる
        document.querySelectorAll('.sale-card.editing').forEach(c => c.classList.remove('editing'));
        const card = document.querySelector(`.sale-card[data-id="${id}"]`);
        if (card) card.classList.add('editing');
    }

    function cancelEdit(id) {
        const card = document.querySelector(`.sale-card[data-id="${id}"]`);
        if (card) card.classList.remove('editing');
    }

    function applyEdit(id) {
        const card = document.querySelector(`.sale-card[data-id="${id}"]`);
        if (!card) return;

        const editDate = card.querySelector('.edit-date').value;
        const editTime = card.querySelector('.edit-time').value;
        const editProduct = card.querySelector('.edit-product').value.trim();
        const editPrice = parseInt(card.querySelector('.edit-price').value) || 0;
        const editBonus = card.querySelector('.edit-bonus').checked;

        if (!editProduct) {
            alert('商品名を入力してください');
            return;
        }
        if (editPrice <= 0) {
            alert('金額を正しく入力してください');
            return;
        }

        // 日時を結合
        const newDate = new Date(`${editDate}T${editTime}:00`);
        // JST文字列に変換
        const jstStr = newDate.toISOString().replace('T', ' ').replace(/\..+/, '');

        // データ更新
        const sale = appData.sales.find(s => String(s.id) === String(id));
        if (sale) {
            sale.date = jstStr;
            sale.productName = editProduct.replace(/, /g, '\n'); // カンマ区切りを改行に戻す
            sale.price = editPrice;
            sale.hasBonus = editBonus;
            markChanged();
        }

        // 再描画
        renderSales();
        showToast('変更を適用しました（まだ保存されていません）');
    }

    // --- 削除 ---
    function deleteSale(id) {
        if (!confirm('この売上記録を削除しますか？')) return;
        appData.sales = appData.sales.filter(s => String(s.id) !== String(id));
        markChanged();
        renderSales();
        showToast('削除しました（まだ保存されていません）');
    }

    // --- 新規追加 ---
    function addNewSale() {
        const now = new Date();
        const jstStr = now.toISOString().replace('T', ' ').replace(/\..+/, '');

        const newSale = {
            id: Date.now() + Math.random(),
            date: jstStr,
            productName: '',
            price: 0,
            machineId: 1,
            machineNum: 1,
            coordNum: '',
            hasBonus: false
        };

        appData.sales.push(newSale);
        markChanged();
        renderSales();

        // 自動的に編集モードを開く
        setTimeout(() => startEdit(newSale.id), 100);
        showToast('新規レコードを追加しました');
    }

    // --- 変更管理 ---
    function markChanged() {
        hasChanges = true;
        document.getElementById('footer-actions').style.display = 'flex';
    }

    function saveAllChanges() {
        if (!confirm('変更を保存しますか？\n（ローカル＆クラウドのデータが上書きされます）')) return;

        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
            originalSales = JSON.parse(JSON.stringify(appData.sales));
            hasChanges = false;
            document.getElementById('footer-actions').style.display = 'none';

            // クラウド同期
            if (appData.cloudUrl) {
                pushToCloud();
            } else {
                showToast('✅ ローカルに保存しました');
            }
        } catch (e) {
            console.error('保存エラー', e);
            alert('保存に失敗しました: ' + e.message);
        }
    }

    // --- クラウド同期 ---
    async function pushToCloud() {
        const payload = {
            lockers: appData.lockers,
            sales: appData.sales,
            presets: appData.presets,
            machineCount: appData.machineCount,
            oneClickMode: appData.oneClickMode
        };

        try {
            showToast('☁️ クラウドに同期中...');
            await fetch(appData.cloudUrl, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            showToast('✅ ローカル＆クラウドに保存しました');
        } catch (err) {
            console.error('Cloud push error:', err);
            showToast('⚠️ ローカル保存済み、クラウド同期に失敗');
        }
    }

    function cancelAllChanges() {
        if (!confirm('すべての変更を取り消しますか？')) return;
        appData.sales = JSON.parse(JSON.stringify(originalSales));
        hasChanges = false;
        document.getElementById('footer-actions').style.display = 'none';
        renderSales();
        showToast('変更を取り消しました');
    }

    // --- ユーティリティ ---
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>"']/g, m => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
        }[m]));
    }

    function showToast(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // ページ離脱時の警告
    window.onbeforeunload = function () {
        if (hasChanges) return '未保存の変更があります';
    };
    </script>
</body>
</html>
